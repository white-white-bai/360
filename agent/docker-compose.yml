# Stage 0: the service alone. Every stage ships what it runs and nothing it does not
# (ADR 0013) — a Milvus profile arrives when retrieval does, not before.
services:
  agent:
    build:
      context: .
    ports:
      # 18088 on the host, not 8788: Windows with Hyper-V/WSL2 reserves dynamic ranges
      # (8240–8940 here), and a port inside one cannot be bound by any user process. The
      # container's own 8788 is unaffected.
      - "18088:8788"
    environment:
      ATP_API_KEY: ${ATP_API_KEY:-}
      ATP_MODEL: ${ATP_MODEL:-}
      ATP_BASE_URL: ${ATP_BASE_URL:-}
      ATP_EMBED_MODEL: ${ATP_EMBED_MODEL:-}
      ATP_DOMAINS_DIR: /domains
    volumes:
      - ../domains:/domains:ro
