[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atp-agent"
version = "0.0.0"
description = "The full-stack service (ADR 0013): a tool-using agent over the platform's own assets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # Stage 1 (RAG): FAISS for meaning, BM25 for words, numpy under both. The local embedder is
  # fastembed (ONNX, no API key): the provider this project uses has no /embeddings route, and a
  # retrieval stage that cannot run on the owner's machine is a diagram, not a stage.
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2",
  "fastembed>=0.4",
  # Stage 2 (the agent graph): LangGraph for the loop and its state, the SQLite checkpointer so
  # a session survives the process. The model client stays our own — it carries the ZDR header
  # and the ledger, and those are not decoration.
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
]

[project.optional-dependencies]
# Stage dependencies arrive WITH their stage (ADR 0013's staging rule): langgraph and
# langchain-openai in stage 2, faiss-cpu and rank-bm25 in stage 1, fastmcp in stage 3,
# opentelemetry and gradio in stage 4. A dependency nothing runs yet is a dependency nobody
# understands.
dev = ["pytest>=8.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
