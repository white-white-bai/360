# A local collector whose only exporter is `debug`: spans print in the container's log, which is
# the honest shape for a single machine — no vendor, no account, nothing leaving the disk.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
