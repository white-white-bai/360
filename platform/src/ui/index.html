<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>黑板 — agent teaching platform</title>
<style>
  :root {
    --board: #16302a;
    --board-edge: #0d1f1b;
    --chalk: #eef3ee;
    --dim: #9fb3aa;
    --accent: #f2d06b;
    --attention: #ef8a63;
    --grid: #2c4a42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 30% 1fr;
    grid-template-rows: auto 1fr auto;
    background: #101a17;
    color: var(--chalk);
    font: 15px/1.65 "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", serif;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 10px 18px;
    background: #0b1512;
    border-bottom: 1px solid #23372f;
    font-size: 13px;
    color: var(--dim);
  }
  header b { color: var(--chalk); font-size: 15px; }
  #clock { margin-left: auto; font-variant-numeric: tabular-nums; }

  #narration {
    overflow-y: auto;
    padding: 18px 20px 40vh;
    background: #0e1815;
    border-right: 1px solid #23372f;
  }
  #narration .chunk { margin: 0 0 14px; }
  #narration .who {
    display: block;
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--dim);
    margin-bottom: 3px;
  }
  #narration .chunk.challenger .who { color: var(--attention); }

  #ask {
    grid-column: 1 / -1;
    display: none;
    gap: 14px;
    align-items: baseline;
    padding: 14px 18px;
    background: #1b2f28;
    border-top: 2px solid var(--accent);
  }
  #ask.open { display: flex; }
  #ask .prompt { flex: 1; color: var(--chalk); }
  #ask .hint { color: var(--dim); font-size: 12px; }
  #ask input {
    flex: 2; min-width: 12rem; padding: 8px 10px; font: inherit;
    background: #0e1a17; color: var(--chalk);
    border: 1px solid var(--grid); border-radius: 3px;
  }
  #ask button {
    padding: 8px 18px; font: inherit; cursor: pointer;
    background: var(--accent); color: #1b2f28; border: 0; border-radius: 3px;
  }

  /* The learner's own question bar (ADR 0008). Open while the lesson is being taught; the
     session takes what is typed at its next pause. */
  #askq {
    grid-column: 1 / -1;
    display: none;
    gap: 14px;
    align-items: flex-end;
    padding: 10px 18px;
    background: #12241e;
    border-top: 1px solid #23372f;
  }
  #askq.open { display: flex; }
  #askq .hint { color: var(--dim); font-size: 12px; }
  #askq textarea {
    flex: 2; min-width: 12rem; padding: 6px 10px; font: inherit; resize: vertical;
    background: #0e1a17; color: var(--chalk);
    border: 1px solid var(--grid); border-radius: 3px;
  }
  #askq button {
    padding: 6px 16px; font: inherit; cursor: pointer;
    background: #2c4a42; color: var(--chalk); border: 0; border-radius: 3px;
  }

  /* The direct classroom (ADR 0011): a conversation, so the transcript is the whole stage —
     the blackboard stays where it belongs, in the mode that draws on it. */
  body.classroom { grid-template-columns: 1fr; }
  body.classroom #board { display: none; }

  /* The entry panel (ADR 0009): who teaches, who challenges, which model. */
  #setup {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #0b1512;
  }
  #setup[hidden] { display: none; }
  #setup .card {
    width: min(640px, 94vw);
    background: #12241e; border: 1px solid #23372f; border-radius: 6px;
    padding: 26px 28px;
  }
  #setup h1 { margin: 0 0 6px; font-size: 20px; color: var(--chalk); }
  #setup .sub { margin: 0 0 18px; color: var(--dim); font-size: 13px; }
  #setup .row, #setup .field {
    display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; align-items: center;
    margin: 10px 0;
  }
  #setup .field { align-items: start; }
  #setup .modes { display: grid; gap: 6px; }
  #setup .mode { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
  #setup .mode-note { display: block; color: var(--dim); font-size: 12px; }
  #setup .field-label { padding-top: 6px; }
  #setup .row[hidden] { display: none; }
  #setup select {
    padding: 6px 8px; font: inherit; background: #0e1a17; color: var(--chalk);
    border: 1px solid var(--grid); border-radius: 3px;
  }
  #setup select:disabled { color: var(--dim); }
  /* The topic is typed; the Catalogue stays visible underneath, because its length is the
     honest statement of what can be taught — and it doubles as suggestions. */
  #setup .field-body { display: grid; gap: 6px; }
  #setup input[type="text"] {
    padding: 7px 10px; font: inherit; background: #0e1a17; color: var(--chalk);
    border: 1px solid var(--grid); border-radius: 3px;
  }
  #setup .catalogue { margin: 0; color: var(--dim); font-size: 12px; }
  #setup .catalogue a { color: var(--chalk); text-decoration: underline dotted; cursor: pointer; }
  #setup .sweep { display: block; margin-top: 6px; color: var(--chalk); }

  /* The review view (ADR 0010): the material a signature accepts, shown before the name. */
  #setup h2 { margin: 20px 0 4px; font-size: 16px; color: var(--chalk); }
  #setup .review-scroll { max-height: 42vh; overflow: auto; margin: 10px 0; padding-right: 6px; }
  #setup .review-scroll h3 {
    margin: 0 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--dim);
  }
  #setup .review-scroll section { margin: 0 0 14px; }
  #setup .review-scroll .item {
    margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--grid); border-radius: 3px;
    background: #0e1a17; font-size: 12.5px;
  }
  #setup .review-scroll .item .meta { display: block; margin-bottom: 4px; color: var(--dim); font-size: 11px; }
  #setup .review-scroll .item .quote { white-space: pre-wrap; overflow-wrap: anywhere; }
  #setup button.quiet { background: #2c4a42; color: var(--chalk); margin-left: 10px; }
  #setup .note { margin: 14px 0; color: var(--dim); font-size: 12px; }
  #setup .result {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 3px;
    font-size: 12.5px; white-space: pre-wrap;
  }
  #setup .result.bad { background: #2a1714; border: 1px solid var(--attention); color: var(--chalk); }
  #setup .result.good { background: #14261f; border: 1px solid var(--grid); color: var(--chalk); }
  #setup .result[hidden] { display: none; }
  #setup button {
    padding: 9px 22px; font: inherit; cursor: pointer;
    background: var(--accent); color: #1b2f28; border: 0; border-radius: 3px;
  }
  #said { grid-column: 1 / -1; padding: 0 18px 8px; color: var(--dim); font-size: 12px; }

  #board {
    position: relative;
    overflow-y: auto;
    padding: 26px 32px 40vh;
    background: radial-gradient(120% 100% at 20% 0%, #1b3a32 0%, var(--board) 60%, var(--board-edge) 100%);
  }
  .empty { color: var(--dim); font-style: italic; }

  .row {
    position: relative;
    margin: 0 0 14px;
    padding: 2px 8px;
    border-left: 3px solid transparent;
  }
  .row.highlighted {
    border-left-color: var(--accent);
    background: rgba(242, 208, 107, .07);
  }
  .row.pointer::after {
    content: "← 在这里";
    position: absolute;
    right: 0;
    top: 0;
    font-size: 12px;
    color: var(--accent);
  }
  .row .tag {
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--dim);
    margin-right: 8px;
  }
  .ensure { animation: land .45s ease-out; }
  @keyframes land { from { opacity: 0; transform: translateY(5px); } }

  svg.axis { width: 100%; max-width: 720px; height: 74px; display: block; }
  svg.axis .rail { stroke: var(--grid); stroke-width: 2; }
  svg.axis .tick { stroke: var(--dim); stroke-width: 1; }
  svg.axis .ticklabel { fill: var(--dim); font-size: 11px; text-anchor: middle; font-family: ui-monospace, monospace; }
  svg.axis .band { fill: var(--grid); opacity: .85; }
  svg.axis .band.attention { fill: var(--attention); opacity: .8; }
  svg.axis .bandlabel { fill: var(--chalk); font-size: 11px; text-anchor: middle; font-family: ui-monospace, monospace; }

  table.board { border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 13px; }
  table.board th, table.board td { border: 1px solid var(--grid); padding: 3px 10px; }
  table.board th { color: var(--accent); font-weight: 500; }

  pre.rich {
    margin: 4px 0; padding: 10px 12px;
    background: #0e1a17; border: 1px dashed var(--grid);
    font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap;
  }
  .connector { color: var(--accent); font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<div id="setup">
  <div class="card">
    <h1>黑板</h1>
    <p class="sub">直接课堂现在就讲；教材课先有逐句可追溯的教材。选完就开始。</p>
    <div class="field">
      <span class="field-label">怎么上</span>
      <div class="field-body modes" id="pick-mode">
        <label class="mode">
          <input type="radio" name="how" value="classroom" checked />
          <span><b>直接课堂</b><span class="mode-note">现在就讲——模型现场回答，未经过语料校验</span></span>
        </label>
        <label class="mode">
          <input type="radio" name="how" value="lesson" />
          <span><b>教材课</b><span class="mode-note">先匹配或现做教材——逐句可追溯到语料，可签字保存</span></span>
        </label>
      </div>
    </div>
    <div class="field">
      <span class="field-label">学什么</span>
      <div class="field-body">
        <input id="pick-topic" type="text" autocomplete="off" placeholder="输入主题：已有的直接上课；没有的，现做一份" />
        <p class="catalogue">已有教材：<span id="catalogue"></span></p>
        <p class="catalogue" id="draft-line" hidden>待签字：<span id="drafts"></span></p>
      </div>
    </div>
    <label class="row"><span>怎么教</span><select id="pick-style"></select></label>
    <label class="row"><span>主讲人</span><select id="pick-lead"></select></label>
    <label class="row"><span>质疑者</span><select id="pick-challenger"></select></label>
    <label class="row" id="model-row"><span>模型</span><select id="pick-model"></select></label>
    <p class="note" id="setup-note">正在读取可选项…</p>
    <p class="result" id="setup-result" hidden></p>
    <button id="start">开始上课</button>

    <div id="review" hidden>
      <h2 id="review-name"></h2>
      <p class="note" id="review-boundary"></p>
      <div id="review-body" class="review-scroll"></div>
      <p class="result bad" id="review-problems" hidden></p>
      <p class="note" id="sweep-line" hidden>
        同主题的其它草稿（来源大多相同）：<span id="sweep-list"></span>
        <label class="sweep"><input type="checkbox" id="review-sweep" checked /> 签字后一并删除它们</label>
      </p>
      <label class="row">
        <span>签字人</span>
        <input id="review-signer" type="text" autocomplete="off" placeholder="你的名字（写入 owner 与 corpusReviewedBy）" />
      </label>
      <button id="review-sign">签字，放进目录</button>
      <button id="review-back" class="quiet">返回</button>
    </div>
  </div>
</div>

<header>
  <b>黑板</b>
  <span id="who"></span>
  <span id="status">连接中…</span>
  <span id="clock"></span>
</header>

<div id="narration"><p class="empty">还没有人开口。</p></div>
<div id="board"><p class="empty">黑板是空的。</p></div>

<form id="ask">
  <span class="prompt"></span>
  <span class="hint"></span>
  <input id="answer" autocomplete="off" />
  <button type="submit">回答</button>
</form>

<form id="askq">
  <span class="hint">课中随时可以提问；老师讲到下一句时会接住。Enter 发送，Shift+Enter 换行。</span>
  <textarea id="askq-text" rows="2" placeholder="关于刚才讲的内容，想问点什么？"></textarea>
  <button type="submit" id="askq-send">提问</button>
</form>
<div id="said"></div>

<script>
const board = document.getElementById("board");
const narration = document.getElementById("narration");
const status = document.getElementById("status");
const who = document.getElementById("who");
const clock = document.getElementById("clock");
const askqForm = document.getElementById("askq");
const askqInput = document.getElementById("askq-text");
const askqHint = askqForm.querySelector(".hint");
const askqSend = document.getElementById("askq-send");
const said = document.getElementById("said");

const ROLE = { "lead-explainer": "主讲", challenger: "质疑者", learner: "你" };

/** What the bar says in a lesson, so the classroom can put it back and vice versa (ADR 0011). */
const LESSON_ASKQ = {
  hint: "课中随时可以提问；老师讲到下一句时会接住。Enter 发送，Shift+Enter 换行。",
  placeholder: "关于刚才讲的内容，想问点什么？",
  send: "提问",
};

/**
 * What each phase of a session is doing, in the learner's terms.
 *
 * Between the connection and the first line of speech the session makes several model calls —
 * claims, verification, probe authoring — and an empty board during them is the product
 * WORKING, not the product broken. Saying so is the difference between waiting and wondering.
 * The builder's stages reuse the same channel (ADR 0010): a topic that matches nothing becomes
 * a draft, and waiting for material is the same kind of wait as waiting for a lesson.
 */
const PHASE_LABELS = {
  "assertion-list": "老师正在定这节课要讲的断言…",
  "structural-verify": "正在核对每条断言的出处…",
  "semantic-verify": "正在独立校验：每条断言是否真的由语料支持…",
  "probe-author": "正在挑几个途中要问你的小问题…",
  narration: "开讲。",
  "terminal-check": "课讲完了，轮到你答题。",
  "probe-evaluation": "老师正在看你刚才的回答…",
  challenger: "质疑者上场。",
  "re-teach": "同一份内容，换个讲法再来一遍…",
  retake: "再答一份新题。",
  "stopped-before-teaching": "有断言没通过校验，这节课停在这里。",
  plan: "正在规划这份新教材：教什么、用哪些来源…",
  fetch: "正在抓取公开来源（原文留档，供审核）…",
  select: "正在从原文里选段…",
  prove: "正在逐条证明引文出自原文…",
  author: "正在起草术语表、误解与检查题…",
  write: "正在写入草稿…",
  validate: "正在用同一套校验器检查草稿…",
};

/** Escape, because the board shows text produced by a model feeding on a corpus. */
function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/**
 * Draw an axis, with the bands that were declared "on" it.
 *
 * This is the only place coordinates exist. The events never carried any — an axis
 * says what range it covers and a band says which axis it belongs to, and the pixels
 * are this renderer's problem. That is why a second renderer is possible at all.
 */
function axisSvg(axis, bands) {
  const W = 720, PAD = 40, RAIL = 34, H = 74;
  const span = (axis.to - axis.from) || 1;
  const x = (value) => PAD + ((value - axis.from) / span) * (W - 2 * PAD);

  const rects = bands.map((band) => {
    const left = x(band.from), right = x(band.to);
    return `<rect class="band ${band.emphasis}" x="${left}" y="${RAIL - 9}"
      width="${Math.max(2, right - left)}" height="18" rx="3"></rect>
      <text class="bandlabel" x="${(left + right) / 2}" y="${RAIL + 24}">${esc(band.label)}</text>`;
  }).join("");

  const ticks = (axis.marks || []).map((mark) => `
    <line class="tick" x1="${x(mark.value)}" x2="${x(mark.value)}" y1="${RAIL - 16}" y2="${RAIL + 8}"></line>
    <text class="ticklabel" x="${x(mark.value)}" y="${RAIL + 44}">${esc(mark.value)}${mark.label ? " " + esc(mark.label) : ""}</text>
  `).join("");

  return `<svg class="axis" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">
    <line class="rail" x1="${PAD - 12}" x2="${W - PAD + 12}" y1="${RAIL}" y2="${RAIL}"></line>
    ${rects}${ticks}
  </svg>`;
}

function renderElement(element, bands) {
  const classes = ["row", element.highlighted ? "highlighted" : ""].join(" ");
  switch (element.kind) {
    case "text":
      return `<div class="${classes}">${esc(element.body)}</div>`;
    case "shape":
      return `<div class="${classes}"><span class="tag">${esc(element.shape)}</span>
        <span class="connector">${esc(element.from)} → ${esc(element.to)}</span></div>`;
    case "axis":
      return `<div class="${classes}"><span class="tag">轴 · ${esc(element.label)}</span>
        ${axisSvg(element, bands.filter((b) => b.axis === element.id))}</div>`;
    case "band":
      // Drawn inside its axis when that axis is on the board; otherwise shown as a
      // statement, because a band without its rail is still information.
      return bands.includes(element) ? "" :
        `<div class="${classes}"><span class="tag">区间</span>${esc(element.axis)}
         ${esc(element.from)}–${esc(element.to)} ${esc(element.label)}</div>`;
    case "table":
      return `<div class="${classes}"><table class="board">
        <tr>${element.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>
        ${element.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}
      </table></div>`;
    case "rich":
      return `<div class="${classes}"><span class="tag">富内容 · ${esc(element.format)}</span>
        <pre class="rich">${esc(element.body)}</pre></div>`;
    default:
      return `<div class="${classes}"><span class="tag">未知元素</span>${esc(JSON.stringify(element))}</div>`;
  }
}

function draw(surface) {
  const bands = surface.elements.filter((e) => e.kind === "band");
  const markup = surface.elements
    .filter((e) => e.kind !== "band" || !surface.elements.some((a) => a.kind === "axis" && a.id === e.axis))
    .map((element) => renderElement(element, bands))
    .join("");

  // Re-built rather than appended to: the Surface is the whole board, and diffing
  // it here would be a second, incremental renderer to keep in agreement.
  board.innerHTML = markup || '<p class="empty">黑板是空的。</p>';
  if (surface.pointer) {
    const rows = [...board.querySelectorAll(".row")];
    rows[rows.length - 1]?.classList.add("pointer");
  }
  const last = board.lastElementChild;
  if (last) last.classList.add("ensure");
  board.scrollTop = board.scrollHeight;
}

function drawNarration(chunks) {
  narration.innerHTML = chunks.map((chunk) => `
    <p class="chunk ${chunk.actor}"><span class="who">${esc(ROLE[chunk.actor] || chunk.actor)}</span>${esc(chunk.text)}</p>
  `).join("") || '<p class="empty">还没有人开口。</p>';
  narration.scrollTop = narration.scrollHeight;
}

// The entry panel (ADR 0009): who teaches, who challenges, which model — chosen before the
// session starts, and carried on the connection that starts it.
const setupPanel = document.getElementById("setup");
const setupNote = document.getElementById("setup-note");
const setupResult = document.getElementById("setup-result");
const reviewPanel = document.getElementById("review");
const reviewName = document.getElementById("review-name");
const reviewBoundary = document.getElementById("review-boundary");
const reviewBody = document.getElementById("review-body");
const reviewProblems = document.getElementById("review-problems");
const reviewSigner = document.getElementById("review-signer");
const sweepLine = document.getElementById("sweep-line");
const sweepList = document.getElementById("sweep-list");
const sweepBox = document.getElementById("review-sweep");
const topicInput = document.getElementById("pick-topic");
const catalogueLine = document.getElementById("catalogue");
const draftLine = document.getElementById("draft-line");
const draftsLine = document.getElementById("drafts");
const stylePick = document.getElementById("pick-style");
const leadPick = document.getElementById("pick-lead");
const challengerPick = document.getElementById("pick-challenger");
const modelRow = document.getElementById("model-row");
const modelPick = document.getElementById("pick-model");
const askForm = document.getElementById("ask");
const answerInput = document.getElementById("answer");

let landed = 0;
/** Whether this page is the learner, and the token its questions travel with. */
let learnerMode = false;
let sessionToken = null;
/** The probe or check the session is currently waiting on. Null means it is not waiting. */
let pendingToken = null;
/** Whether this page is in the direct classroom (ADR 0011), and its transcript so far. */
let classroomMode = false;
let classroomChunks = [];

/** Wire one lesson's stream. The page connects when the learner starts, not when it loads. */
function connect(url) {
  // One attempt at a time: a new connection describes a new attempt, so the counters that
  // describe it start over with it — the classroom's transcript included.
  landed = 0;
  pendingToken = null;
  classroomMode = false;
  classroomChunks = [];
  document.body.classList.remove("classroom");
  askqHint.textContent = LESSON_ASKQ.hint;
  askqInput.placeholder = LESSON_ASKQ.placeholder;
  askqSend.textContent = LESSON_ASKQ.send;
  const source = new EventSource(url);

  source.addEventListener("meta", (message) => {
    const meta = JSON.parse(message.data);
    who.textContent = meta.expert;
    learnerMode = meta.learner === true;
    sessionToken = meta.token ?? null;

    if (meta.classroom === true) {
      // The direct classroom (ADR 0011). The session says which mode it is in for its whole
      // length, because the one thing this mode may never do is pass for the verified one.
      classroomMode = true;
      document.body.classList.add("classroom");
      narration.innerHTML = '<p class="empty">老师马上开口…</p>';
      status.textContent = "直接课堂 · 未校验";
      clock.textContent = "";
      said.textContent = "（直接课堂：回答由模型现场给出，不查语料、不判分。）";
      askqForm.classList.add("open");
      askqHint.textContent = "直接课堂：说你的理解、问你的问题。Enter 发送，Shift+Enter 换行。";
      askqInput.placeholder = "用你自己的话说说，或直接问…";
      askqSend.textContent = "说";
      askqInput.focus();
      return;
    }

    status.textContent = meta.mode === "live" ? "实时 provider" : "夹具回放";
    // The question bar belongs to a board where somebody can take a question. A recording has
    // no answer on file, so offering the input there would be offering nothing.
    askqForm.classList.toggle("open", meta.questions === true);
    if (learnerMode && meta.questions !== true) {
      said.textContent = "（这是录制回放：可以答，不能问——提问要接上真模型，加 ?live=1。）";
    }
  });

  source.addEventListener("turn", (message) => {
    // Rendered when complete, not streamed (ADR 0011): the reply's last line decides whether the
    // Challenger speaks, and the marker for that must never reach the learner.
    const turn = JSON.parse(message.data);
    classroomChunks.push({ actor: turn.actor, text: turn.text });
    drawNarration(classroomChunks);
  });

  source.addEventListener("ready", (message) => {
    const info = JSON.parse(message.data);
    clock.textContent = `调用 ${info.calls} 次${info.costUsd > 0 ? ` · 约 $${info.costUsd.toFixed(4)}` : ""}`;
    said.textContent = "（说完了，轮到你。）";
    askqInput.focus();
  });

  source.addEventListener("closed", () => {
    // Idle, not failed: nobody said anything for long enough that the classroom let go.
    source.close();
    status.textContent = "下课";
    said.textContent = "（太久没说话，这节课先下了。想继续就再开始一节。）";
    setupPanel.hidden = false;
  });

  source.addEventListener("surface", (message) => {
    const payload = JSON.parse(message.data);
    landed += 1;
    clock.textContent = `已落第 ${landed} 步`;
    draw(payload.surface);
    drawNarration(payload.narration);
  });

  source.addEventListener("phase", (message) => {
    const { phase } = JSON.parse(message.data);
    const label = PHASE_LABELS[phase];
    if (label !== undefined) said.textContent = "（" + label + "）";
  });

  source.addEventListener("question", (message) => {
    const question = JSON.parse(message.data);
    pendingToken = question.token;
    askForm.querySelector(".prompt").textContent = "【问】" + question.prompt;
    askForm.querySelector(".hint").textContent = question.skippable ? "（直接回车表示跳过）" : "";
    askForm.classList.add("open");
    answerInput.value = "";
    answerInput.focus();
    // The session is stopped at this moment, so the page has to be where the eyes are.
    askForm.scrollIntoView({ block: "nearest" });
  });

  source.addEventListener("heard", (message) => {
    const heard = JSON.parse(message.data);
    // Cleared on the token, not on the submit: the session moves on either way, and a question
    // that timed out would otherwise leave the page asking for an answer nobody is waiting for.
    if (heard.token === pendingToken) {
      pendingToken = null;
      askForm.classList.remove("open");
    }
    said.textContent = heard.answer.trim() === "" ? "（跳过）" : "你答：" + heard.answer;
  });

  source.addEventListener("question-taken", (message) => {
    const taken = JSON.parse(message.data);
    said.textContent = "你问：" + taken.text;
  });

  source.addEventListener("question-dropped", () => {
    said.textContent = "（课已经结束了，刚才的问题没来得及问。）";
  });

  source.addEventListener("draft", (message) => {
    // Ended is ended: EventSource reconnects on its own after a stream closes, and a reconnect
    // would run the whole build again — six claims made, six bills to pay, one lesson wanted.
    source.close();
    const made = JSON.parse(message.data);
    status.textContent = "等审核";
    const done = `这份教材做好了：《${made.name}》（${made.id}）。签了字才能上课：npm run review-domain -- ${made.id}（签完再点开始，就能匹配到它。）`;
    said.textContent = done;
    setupResult.className = "result good";
    setupResult.hidden = false;
    setupResult.textContent = done;
    setupPanel.hidden = false;
  });

  source.addEventListener("pending", (message) => {
    // Ended is ended: see the draft handler. A topic that already has a draft is not built a
    // second time — the signature is the door, and a single match opens its review right here.
    source.close();
    const pending = JSON.parse(message.data);
    const list = pending.drafts.map((draft) => `《${draft.name}》（${draft.id}）`).join("、");
    const text =
      pending.drafts.length === 1
        ? `这个主题已经有一份草稿：${list}——下面就是它，过目后签字。`
        : `这个主题匹配到不止一份草稿：${list}——在「待签字」里点一份，过目后再签。`;
    status.textContent = "等审核";
    said.textContent = text;
    setupResult.className = "result good";
    setupResult.hidden = false;
    setupResult.textContent = text;
    setupPanel.hidden = false;
    if (pending.drafts.length === 1) void openReview(pending.drafts[0].id);
  });

  source.addEventListener("done", (message) => {
    const result = JSON.parse(message.data);
    source.close();

    if (result.stoppedBefore === "semantic") {
      // Stopped before teaching (ADR 0005): nothing was said because a claim could not be
      // verified — and a stop that does not say WHICH claim is a dead end, not a lesson.
      const lines = result.unsupported.map((verdict) => `${verdict.id}：${verdict.reason}`);
      const text =
        "这节课停在这里：有断言没通过独立校验，所以一个字都没讲。\n" +
        lines.join("\n") +
        "\n（可以再开始一次——清单每次现生成；要是总停在这一步，就是这门教材本身要改。）";
      status.textContent = "停在这里：断言没通过校验";
      said.textContent = text;
      setupResult.className = "result bad";
      setupResult.hidden = false;
      setupResult.textContent = text;
      setupPanel.hidden = false;
      return;
    }

    const final = result.retaken ? "重考" : "首考";
    status.textContent = `${result.passed ? "通过" : "未通过"}（${final} · ${result.checkId}）`;
    if (result.saved === true) {
      // The learner has to be TOLD the name of their own record, or coming back tomorrow is
      // something only the experiment can do.
      said.textContent = `这节课记下来了：${result.sessionId} — 明天回来跑 npm run enter -- --followup ${result.sessionId}`;
    }
  });

  source.addEventListener("failed", (message) => {
    // Ended is ended: see the draft handler. A reconnect here would rerun the whole session,
    // or the whole build, without anyone asking for it.
    source.close();
    // The payload is a JSON string, and it is parsed rather than shown raw so a multi-line
    // reason does not arrive wrapped in quotes. The message can be several lines (a build that
    // refused lists every problem), and the panel comes back with it: a failed attempt should
    // be one edit away from a retry.
    const reason = JSON.parse(message.data);
    status.textContent = "出错";
    said.textContent = "出错：" + reason;
    setupResult.className = "result bad";
    setupResult.hidden = false;
    setupResult.textContent = "上一次没有做成：\n" + reason;
    setupPanel.hidden = false;
  });
}

askForm.addEventListener("submit", (event) => {
  event.preventDefault();
  if (pendingToken === null) return;
  const token = pendingToken;
  pendingToken = null;
  askForm.classList.remove("open");
  fetch("/answer", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token, text: answerInput.value }),
  });
  answerInput.value = "";
});

askqForm.addEventListener("submit", (event) => {
  event.preventDefault();
  if (sessionToken === null) return;
  const text = askqInput.value.trim();
  if (text === "") return;

  if (classroomMode) {
    // Straight into the model's context, with the whole conversation behind it — that is what
    // this mode is (ADR 0011).
    fetch("/say", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: sessionToken, text }),
    }).then((response) => {
      if (response.ok) {
        askqInput.value = "";
        classroomChunks.push({ actor: "learner", text });
        drawNarration(classroomChunks);
        said.textContent = "（老师正在讲…）";
      } else {
        // 409 is the honest case: the teacher is mid-turn, or the classroom is over.
        said.textContent = "（这会儿说不了：老师正讲着这一轮，等它说完。）";
      }
    });
    return;
  }

  if (!learnerMode) return;
  fetch("/question", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token: sessionToken, text }),
  }).then((response) => {
    if (response.ok) {
      askqInput.value = "";
      said.textContent = "（问出去了，老师讲到下一句时会接住。）";
    } else {
      // 409 is the honest case: one is already waiting, or the lesson can no longer take it.
      said.textContent = "（现在问不了：等老师把上一个问题答完，或者这节课已经结束。）";
    }
  });
});

askqInput.addEventListener("keydown", (event) => {
  // Enter sends, Shift+Enter makes a new line. `isComposing` keeps a Chinese IME's
  // confirmation Enter from sending half a word.
  if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
  event.preventDefault();
  askqForm.requestSubmit();
});

// ---------------------------------------------------------------- the setup --

let offered = null;

const howPicks = [...document.querySelectorAll('input[name="how"]')];
const how = () => (howPicks.find((pick) => pick.checked) ?? howPicks[0]).value;
/** What the note says in lesson mode. The classroom's note depends on the choice (ADR 0011). */
let lessonNote = "";

/** The entry panel answers to the mode first: the topic means different things in each. */
function howChanged() {
  const direct = how() === "classroom";
  topicInput.placeholder = direct
    ? "输入你想学的主题：直接开讲，不先做教材"
    : "输入主题：已有的直接上课；没有的，现做一份";
  setupNote.textContent = direct
    ? `直接课堂：${offered === null || offered.provider === null ? "模型" : offered.provider} 现场回答，` +
      "不查语料、不判分；要逐句可追溯的课，切到「教材课」。"
    : lessonNote;
}
for (const pick of howPicks) pick.addEventListener("change", howChanged);

/** One option per offering, with the same one-line detail the terminal prints. */
function fill(select, entries) {
  for (const entry of entries) {
    const option = document.createElement("option");
    option.value = entry.id;
    option.textContent = entry.label;
    option.title = entry.detail;
    select.append(option);
  }
}

/** Build the entry panel from one `/options` snapshot. Re-runnable: a signature changes it. */
function applyOptions(options) {
  offered = options;

  // The Catalogue stays visible under the input: its length is the honest statement of what can
  // be taught, and clicking a name is the same as typing it.
  catalogueLine.replaceChildren();
  for (const domain of options.domains) {
    const chip = document.createElement("a");
    chip.href = "#";
    chip.textContent = domain.label;
    chip.title = domain.detail;
    chip.addEventListener("click", (event) => {
      event.preventDefault();
      topicInput.value = domain.label;
    });
    catalogueLine.append(chip, document.createTextNode("　"));
  }

  // Drafts are visible, and still not selectable into a lesson: they have not been signed. What
  // clicking one opens is the review — the material first, then the signature.
  draftsLine.replaceChildren();
  draftLine.hidden = options.drafts.length === 0;
  for (const draft of options.drafts) {
    const chip = document.createElement("a");
    chip.href = "#";
    chip.textContent = draft.name;
    chip.title = `草稿 ${draft.id}——点击审核并签字`;
    chip.addEventListener("click", (event) => {
      event.preventDefault();
      void openReview(draft.id);
    });
    draftsLine.append(chip, document.createTextNode("　"));
  }

  for (const select of [stylePick, leadPick, challengerPick]) select.replaceChildren();
  fill(stylePick, options.styles);
  for (const select of [leadPick, challengerPick]) fill(select, options.personas);

  modelPick.replaceChildren();
  if (options.live) {
    modelRow.hidden = options.models.length === 0;
    for (const model of options.models) {
      const option = document.createElement("option");
      option.value = model;
      option.textContent = model;
      modelPick.append(option);
    }
    if (options.defaultModel !== null) modelPick.value = options.defaultModel;
    for (const pick of howPicks) if (pick.value === "classroom") pick.disabled = false;
    lessonNote = `将用 ${options.provider} 上课：输入主题——已有的直接上课；没有的，现做一份（做完在页面上签字，才进目录）；或者切到「直接课堂」，现在就讲。`;
  } else {
    // The recording is one take — one Domain, one Style, one voice. Locked rather than hidden:
    // the panel still says what the take contains, it just cannot pretend it could differ, and
    // with no provider a new topic cannot be built either.
    const recorded = options.domains.find((domain) => domain.id === options.recorded.domain);
    topicInput.value = recorded === undefined ? "" : recorded.label;
    stylePick.value = options.recorded.style;
    leadPick.value = options.recorded.persona;
    challengerPick.value = options.recorded.persona;
    for (const select of [stylePick, leadPick, challengerPick]) select.disabled = true;
    modelRow.hidden = true;
    // The direct classroom is nothing but a provider talking (ADR 0011), and there is no
    // provider here — locked, and the mode choice falls back to the one take on file.
    for (const pick of howPicks) if (pick.value === "classroom") pick.disabled = true;
    const lessonPick = howPicks.find((pick) => pick.value === "lesson");
    if (lessonPick !== undefined) lessonPick.checked = true;
    lessonNote = "没有配置 provider：录播只有一节「时间戳、时区与夏令时」。输入它（或「时区」）可以直接上；别的主题做不了新教材，直接课堂也讲不了。";
  }
  howChanged();
}

async function fetchOptions() {
  try {
    applyOptions(await (await fetch("/options")).json());
  } catch (error) {
    setupNote.textContent = "读不到可选项：" + error.message;
  }
}

// ------------------------------------------------------------- review + sign --

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className !== undefined) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** One card in the review: where it came from, then the text itself. */
function itemBlock(meta, body) {
  const item = element("div", "item");
  if (meta !== "") item.append(element("span", "meta", meta));
  item.append(element("div", "quote", body));
  return item;
}

let reviewId = null;
let reviewLabel = "";

/**
 * Show the material a signature accepts, and take the name.
 *
 * The gate is only a gate if the person sees what they are vouching for (ADR 0010): the sources,
 * the passages themselves, and what will be asked. That is what this renders before the button.
 */
async function openReview(id) {
  try {
    const response = await fetch(`/draft?id=${encodeURIComponent(id)}`);
    if (!response.ok) throw new Error(await response.text());
    const draft = await response.json();

    reviewId = draft.id;
    reviewLabel = draft.name;
    reviewName.textContent = `《${draft.name}》`;
    reviewBoundary.textContent = draft.boundary;
    reviewSigner.value = "";
    reviewProblems.hidden = true;
    reviewBody.replaceChildren();

    const sources = element("section");
    sources.append(element("h3", undefined, `来源（${draft.sources.length}）`));
    for (const source of draft.sources) {
      sources.append(
        itemBlock(
          `[${source.index}] 抓取于 ${source.fetchedAt} · sha256 ${String(source.sha256).slice(0, 12)}…`,
          source.url,
        ),
      );
    }
    reviewBody.append(sources);

    const corpus = element("section");
    corpus.append(element("h3", undefined, `语料段落（${draft.passages.length}）`));
    for (const passage of draft.passages) {
      corpus.append(itemBlock(`${passage.id} — ${passage.source}`, passage.text));
    }
    reviewBody.append(corpus);

    const teaching = element("section");
    teaching.append(element("h3", undefined, `误解（${draft.misconceptions.length}）与检查（${draft.checks.length}）`));
    for (const entry of draft.misconceptions) {
      teaching.append(itemBlock(`${entry.id} · 学生常错`, `${entry.name}：${entry.wrongModel}`));
    }
    for (const check of draft.checks) {
      teaching.append(itemBlock(`${check.id} · 末尾检查`, `${check.prompt}\n（期望：${check.expected}）`));
    }
    reviewBody.append(teaching);

    // Near-duplicate drafts: shown with their shared-source count, swept only if the box stays
    // ticked. Deletion is a person's decision, made with the names in front of them.
    sweepBox.checked = true;
    sweepLine.hidden = draft.siblings.length === 0;
    sweepList.textContent = draft.siblings
      .map((sibling) => `《${sibling.name}》（${sibling.id}，共用 ${sibling.shared} 份来源）`)
      .join("、");

    if (draft.problems.length > 0) {
      reviewProblems.hidden = false;
      reviewProblems.textContent = "这份草稿没通过校验，不能签字：\n" + draft.problems.join("\n");
    }

    reviewPanel.hidden = false;
    reviewPanel.scrollIntoView({ block: "nearest" });
    reviewSigner.focus();
  } catch (error) {
    setupPanel.hidden = false;
    setupResult.className = "result bad";
    setupResult.hidden = false;
    setupResult.textContent = `读不到这份草稿：${error.message}`;
  }
}

document.getElementById("review-sign").addEventListener("click", () => {
  if (reviewId === null) return;
  const signer = reviewSigner.value.trim();
  if (signer === "") {
    reviewSigner.focus();
    reviewProblems.hidden = false;
    reviewProblems.textContent = "签字需要一个名字——这份材料要有具体的人负责（它会写进 owner）。";
    return;
  }

  fetch("/sign", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: reviewId, name: signer, sweep: sweepBox.checked }),
  })
    .then(async (response) => {
      if (!response.ok) throw new Error(await response.text());
      const signed = await response.json();
      reviewPanel.hidden = true;
      reviewId = null;
      const cleared =
        signed.deleted.length === 0
          ? ""
          : `并删除了 ${signed.deleted.length} 份同主题草稿：${signed.deleted.join("、")}。`;
      setupResult.className = "result good";
      setupResult.hidden = false;
      setupResult.textContent = `已签字：《${reviewLabel}》进目录了（${signed.id}）。${cleared}在「已有教材」里点它，或直接输入它的名字，就能上课。`;
      await fetchOptions();
    })
    .catch((error) => {
      reviewProblems.hidden = false;
      reviewProblems.textContent = `没有签成：${error.message}`;
    });
});

document.getElementById("review-back").addEventListener("click", () => {
  reviewPanel.hidden = true;
  reviewId = null;
});

fetchOptions();

document.getElementById("start").addEventListener("click", () => {
  if (offered === null) return;
  const topic = topicInput.value.trim();
  if (topic === "") {
    setupNote.textContent =
      how() === "classroom"
        ? "先写一个你想学的主题——老师就讲它。"
        : "先写一个主题——已有的直接上课，没有的现做一份。";
    topicInput.focus();
    return;
  }

  if (how() === "classroom") {
    // The subject is not matched against anything and nothing is built: it goes to the model
    // as the thing to teach (ADR 0011). Same three knobs, no fourth.
    const params = new URLSearchParams({
      topic,
      style: stylePick.value,
      persona: leadPick.value,
      challenger: challengerPick.value,
    });
    if (modelPick.value !== "") params.set("model", modelPick.value);
    setupPanel.hidden = true;
    connect(`/classroom?${params.toString()}`);
    return;
  }

  const params = new URLSearchParams({ learner: "1", topic });
  if (offered.live) {
    params.set("live", "1");
    params.set("style", stylePick.value);
    params.set("persona", leadPick.value);
    params.set("challenger", challengerPick.value);
    if (modelPick.value !== "") params.set("model", modelPick.value);
  }
  setupPanel.hidden = true;
  connect(`/board?${params.toString()}`);
});
</script>
</body>
</html>
